# NOTE: local-dev DB/RabbitMQ/mongodb services (eventstracker, runs-app,
# runs-ai-analyzer, mytracker, rabbitmq, gotoaws-sathish's mongodb) moved to
# consolidated-postgres/compose/docker-compose-local.yml — this file is scoped to
# the Spring Cloud Config Server only from here on.
# See consolidated-postgres/docs/ENVIRONMENTS.md.
#
# `name: sathish-project-infra` is kept unchanged on purpose — consolidated-postgres's
# compose file uses the same project name, so both files' resources stay recognized as
# part of the same logical group without actually needing to run together.
name: sathish-project-infra
services:
  config-server:
    container_name: sathish-config-server
    image: travelhelper0h/sathishproject-config-server:latest
    ports:
      - "8888:8888"
    environment:
      - GIT_URI=${GIT_URI}
      - encrypt_key=${encrypt_key}
      - username=${username}
      - pass=${pass}
      - APP_PORT=${APP_PORT}
    networks:
      - gotoaws_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gotoaws_net:
    driver: bridge
